<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestria — Démo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    color: #ececec;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .player {
    position: relative;
    max-width: 1280px;
    width: 100%;
  }
  .screen {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(16,185,129,0.08);
  }
  .screen img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.05s;
  }
  .screen img.active { opacity: 1; }
  .controls {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 8px;
  }
  .btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ececec;
    padding: 8px 20px;
    border-radius: 9999px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.4); }
  .btn:active { transform: scale(0.97); }
  .timeline {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 9999px;
    cursor: pointer;
    position: relative;
  }
  .timeline-fill {
    height: 100%;
    background: #10b981;
    border-radius: 9999px;
    width: 0%;
    transition: width 0.05s linear;
  }
  .counter {
    font-size: 12px;
    color: #8a8a8a;
    font-variant-numeric: tabular-nums;
    min-width: 60px;
    text-align: right;
  }
  .title {
    position: absolute;
    top: 16px;
    left: 20px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    color: rgba(236,236,236,0.6);
    z-index: 10;
    pointer-events: none;
  }
  .speed {
    display: flex;
    gap: 4px;
  }
  .speed button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    color: #8a8a8a;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
  }
  .speed button.active { color: #10b981; border-color: rgba(16,185,129,0.4); }
</style>
</head>
<body>
  <div class="player">
    <div class="screen" id="screen">
      <span class="title">Maestria</span>
    </div>
    <div class="controls">
      <button class="btn" id="playBtn">Lecture</button>
      <div class="timeline" id="timeline">
        <div class="timeline-fill" id="timelineFill"></div>
      </div>
      <span class="counter" id="counter">0 / 36</span>
      <div class="speed">
        <button data-speed="0.5">0.5x</button>
        <button data-speed="1" class="active">1x</button>
        <button data-speed="2">2x</button>
      </div>
    </div>
  </div>

<script>
const TOTAL = 36;
const FPS = 15;
const screen = document.getElementById('screen');
const playBtn = document.getElementById('playBtn');
const timelineFill = document.getElementById('timelineFill');
const counter = document.getElementById('counter');
const timeline = document.getElementById('timeline');

const frames = [];
for (let i = 1; i <= TOTAL; i++) {
  const img = document.createElement('img');
  img.src = `demo-frames/${String(i).padStart(6,'0')}.jpg`;
  img.dataset.idx = i - 1;
  screen.appendChild(img);
  frames.push(img);
}

let current = 0;
let playing = false;
let speed = 1;
let lastTime = 0;
let accum = 0;

function showFrame(idx) {
  frames.forEach((f, i) => f.classList.toggle('active', i === idx));
  current = idx;
  timelineFill.style.width = `${(idx / (TOTAL - 1)) * 100}%`;
  counter.textContent = `${idx + 1} / ${TOTAL}`;
}

function animate(time) {
  if (!playing) return;
  if (!lastTime) lastTime = time;
  const dt = time - lastTime;
  lastTime = time;
  accum += dt * speed;
  const frameDuration = 1000 / FPS;
  while (accum >= frameDuration) {
    accum -= frameDuration;
    current++;
    if (current >= TOTAL) {
      current = 0;
    }
    showFrame(current);
  }
  requestAnimationFrame(animate);
}

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Lecture';
  if (playing) {
    lastTime = 0;
    requestAnimationFrame(animate);
  }
});

timeline.addEventListener('click', (e) => {
  const rect = timeline.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  showFrame(Math.round(pct * (TOTAL - 1)));
});

document.querySelectorAll('.speed button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.speed button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    speed = parseFloat(b.dataset.speed);
  });
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  if (e.code === 'ArrowRight') showFrame(Math.min(TOTAL - 1, current + 1));
  if (e.code === 'ArrowLeft') showFrame(Math.max(0, current - 1));
});

// Preload then show first frame
Promise.all(frames.map(f => f.decode().catch(() => {})))
  .then(() => { showFrame(0); playing = true; playBtn.textContent = 'Pause'; lastTime = 0; requestAnimationFrame(animate); })
  .catch(() => { showFrame(0); playing = true; playBtn.textContent = 'Pause'; lastTime = 0; requestAnimationFrame(animate); });
</script>
</body>
</html>
